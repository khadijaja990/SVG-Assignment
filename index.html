<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation Card</title>
    <link rel="stylesheet" href="styles/style.css">

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="#">🎉 Celebrate</a>
            <div class="nav-links">
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
        </nav>
        <header>
            <p>YOU'RE INVITED TO A</p>
            <h1 class="animate__animated animate__zoomIn">Celebration <br> Day</h1>
        </header>
<main>
    <section>
        <p class="description">Join us for a day full of happiness and fun!</p>
        <div class="event-details">
            <!-- Inline SVG - Calendar -->
            <div class="event-item">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="4" width="18" height="17" rx="2" stroke="#d9a7ff" stroke-width="2"/>
                    <line x1="3" y1="9" x2="21" y2="9" stroke="#d9a7ff" stroke-width="2"/>
                    <line x1="8" y1="2" x2="8" y2="6" stroke="#d9a7ff" stroke-width="2"/>
                    <line x1="16" y1="2" x2="16" y2="6" stroke="#d9a7ff" stroke-width="2"/>
                </svg>
                <p>Saturday<br>28 September</p>
            </div>

            <!-- Inline SVG - Location -->
            <div class="event-item">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                    <path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" stroke="#e94f9f" stroke-width="2"/>
                    <circle cx="12" cy="9" r="2" stroke="#e94f9f" stroke-width="2"/>
                </svg>
                <p>Stockholm</p>
            </div>

            <!-- Inline SVG - Clock -->
            <div class="event-item">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="8" stroke="#d9a7ff" stroke-width="2"/>
                    <line x1="12" y1="8" x2="12" y2="12" stroke="#d9a7ff" stroke-width="2"/>
                    <line x1="12" y1="12" x2="15" y2="14" stroke="#d9a7ff" stroke-width="2"/>
                </svg>
                <p>10:00 AM</p>
            </div>
        </div>
        <button>Join the Celebration →</button>
    </section>
</main>
<div class="gift">
    <img src="gift.svg" alt="Gift">
</div>
<footer>
    <p>See you there! 🎉</p>
</footer> 
</div> 
</body>
</html>
